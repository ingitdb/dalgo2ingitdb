name: Go CI

on:
  push:
    branches-ignore:
      - renovate/**
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      require_conventional_pr_title: true
      code_coverage: true
      min_test_coverage_percent: 80

  windows_tests:
    # File locking and path handling differ on Windows (mandatory LockFileEx
    # locks, `\` separators); strongo/cicd runs on ubuntu only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Configure Git identity for commit tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Test
        run: go test -count=1 ./...
